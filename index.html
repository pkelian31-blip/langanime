<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LANGANIME 🌱 — Language & Anime Learning</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --dark: #1a1a2e; --bg: #f8fafb; --card: #ffffff; --text: #2d2d2d;
  --green-d: #1b5e20; --green: #43a047; --green-l: #e8f5e9; --gold: #ffd600;
  --en-d: #1565c0; --en: #1a73e8; --en-l: #e8f0fe;
  --fr-d: #c2185b; --fr: #e91e63; --fr-l: #fce4ec;
  --es-d: #b71c1c; --es: #e53935; --es-l: #ffebee; --es-gold: #fdd835;
  --jp-d: #4a148c; --jp: #9c27b0; --jp-l: #f3e5f5; --jp-pink: #f8bbd0;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Nunito',sans-serif; background:var(--bg); color:var(--text); overflow-x:hidden; }
.progress-bar { height:4px; background:linear-gradient(90deg,var(--gold),var(--en),var(--fr),var(--es),var(--jp)); width:0%; transition:width .3s; position:fixed; top:0; left:0; z-index:9999; }
@keyframes confettiFall { to { transform:translateY(110vh) rotate(720deg); opacity:0 } }
@keyframes slideInRight { from { transform:translateX(120%);opacity:0 } to { transform:translateX(0);opacity:1 } }
@keyframes popIn { from{transform:scale(.7);opacity:0} to{transform:scale(1);opacity:1} }
@keyframes pop { 0%{transform:scale(0);opacity:0} 80%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
@keyframes pulse-step { 0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,.3)} 50%{box-shadow:0 0 0 8px rgba(255,255,255,.12)} }

/* WELCOME OVERLAY */
#welcomeOverlay { position:fixed; inset:0; z-index:9000; background:linear-gradient(135deg, #1b5e20 0%, #2e7d32 40%, #1a4a1c 100%); display:flex; align-items:center; justify-content:center; animation:fadeInOverlay .6s ease; }
@keyframes fadeInOverlay { from{opacity:0} to{opacity:1} }
.welcome-box { background:white; border-radius:28px; padding:48px 40px; max-width:520px; width:90%; text-align:center; box-shadow:0 24px 80px rgba(0,0,0,.4); animation:popIn .7s cubic-bezier(.2,1.3,.5,1); }
.welcome-logo { font-family:'Baloo 2',cursive; font-size:3.2rem; font-weight:800; background:linear-gradient(135deg,var(--green-d),var(--green),var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1.1; margin-bottom:4px; }
.welcome-tagline { color:#555; font-size:1rem; margin-bottom:24px; font-weight:600; }
.welcome-mascot-wrap { position:relative; display:inline-flex; flex-direction:column; align-items:center; margin-bottom:20px; }
.welcome-input { width:100%; padding:11px 16px; border:2px solid #ddd; border-radius:12px; font-size:.93rem; font-family:'Nunito',sans-serif; outline:none; transition:border-color .2s; margin-bottom:10px; }
.welcome-input:focus { border-color:var(--green); }
.welcome-btn { width:100%; padding:12px; background:linear-gradient(135deg,var(--green),var(--green-d)); color:white; border:none; border-radius:12px; font-family:'Baloo 2',cursive; font-size:1rem; font-weight:700; cursor:pointer; transition:transform .2s,box-shadow .2s; box-shadow:0 4px 16px rgba(67,160,71,.4); }
.welcome-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(67,160,71,.5); }
.welcome-btn:active { transform:scale(.98); }
.welcome-btn:disabled { opacity:.5; cursor:not-allowed; pointer-events:none; }

/* WELCOME STEPS */
.w-step { display:none; }
.w-step.active { display:block; animation:popIn .5s cubic-bezier(.2,1.3,.5,1); }
.w-lang-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
.w-lang-btn { padding:14px; border:2px solid #e0e0e0; border-radius:12px; background:#f8f8f8; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:700; font-size:.95rem; transition:all .2s; text-align:center; }
.w-lang-btn:hover { border-color:var(--green); background:var(--green-l); }
.w-lang-btn.selected { border-color:var(--green); background:var(--green-l); color:var(--green-d); }
.w-step-dots { display:flex; justify-content:center; gap:8px; margin-bottom:18px; }
.w-dot { width:10px; height:10px; border-radius:50%; background:#ddd; transition:background .3s; }
.w-dot.active { background:var(--green); }
.goal-grid { display:flex; flex-direction:column; gap:8px; margin:14px 0; }
.goal-btn { padding:11px 14px; border:2px solid #e0e0e0; border-radius:10px; background:#f8f8f8; cursor:pointer; font-family:'Nunito',sans-serif; font-weight:700; font-size:.88rem; transition:all .2s; text-align:left; }
.goal-btn:hover { border-color:var(--green); background:var(--green-l); }
.goal-btn.selected { border-color:var(--green); background:var(--green-l); color:var(--green-d); }

/* MAIN HEADER */
#mainSite { display:none; }
.site-header { background:linear-gradient(135deg, #1b5e20 0%, #2e7d32 50%, #33691e 100%); position:relative; overflow:hidden; }
.header-top { display:flex; align-items:center; justify-content:space-between; padding:16px 40px 10px; }
.school-badge { background:white; color:var(--green-d); font-family:'Baloo 2',cursive; font-weight:800; font-size:1rem; padding:5px 16px; border-radius:30px; }
.header-greeting { color:rgba(255,255,255,.85); font-size:.9rem; font-weight:700; }
.header-body { display:flex; align-items:flex-end; justify-content:space-between; padding:0 40px 0; gap:20px; }
.header-text { flex:1; padding-bottom:28px; }
.cr-logo-big { font-family:'Baloo 2',cursive; font-weight:800; font-size:4rem; color:white; line-height:1; text-shadow:4px 4px 0 rgba(0,0,0,.25); letter-spacing:2px; }
.cr-logo-big span { color:var(--gold); }
.header-sub { color:rgba(255,255,255,.9); font-size:1rem; margin-top:6px; font-weight:600; }
.header-desc { color:rgba(255,255,255,.8); font-size:.9rem; margin-top:6px; max-width:480px; line-height:1.5; }
.progress-pills { display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
.prog-pill { padding:4px 12px; border-radius:20px; font-size:.75rem; font-weight:800; border:1.5px solid rgba(255,255,255,.4); color:rgba(255,255,255,.7); background:rgba(255,255,255,.1); letter-spacing:.5px; }
.prog-pill.unlocked { background:var(--gold); color:#333; border-color:var(--gold); }
.mascot-wrap { width:210px; flex-shrink:0; position:relative; bottom:0; }
.mascot-svg { width:100%; filter:drop-shadow(0 8px 24px rgba(0,0,0,.3)); animation:float 3s ease-in-out infinite; }
.hshape { position:absolute; border-radius:50%; opacity:.07; pointer-events:none; }
.hshape1 { width:320px; height:320px; background:white; top:-80px; right:140px; }
.hshape2 { width:180px; height:180px; background:var(--gold); bottom:-60px; left:80px; }

/* JOURNEY STEPPER */
.journey-stepper { display:flex; align-items:center; gap:0; margin-top:18px; background:rgba(0,0,0,.15); border-radius:40px; padding:6px 10px; width:fit-content; max-width:100%; }
.step-item { display:flex; align-items:center; gap:0; }
.step-dot { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.95rem; font-weight:800; cursor:pointer; transition:all .25s; position:relative; flex-shrink:0; border:2.5px solid rgba(255,255,255,.3); background:rgba(255,255,255,.12); color:rgba(255,255,255,.6); }
.step-dot.done { background:var(--gold); color:#333; border-color:var(--gold); box-shadow:0 0 0 4px rgba(255,214,0,.25); }
.step-dot.current { background:white; color:var(--green-d); border-color:white; box-shadow:0 0 0 4px rgba(255,255,255,.3); animation:pulse-step 2s ease-in-out infinite; }
.step-dot.locked-dot { background:rgba(255,255,255,.08); color:rgba(255,255,255,.35); border-color:rgba(255,255,255,.15); cursor:pointer; }
.step-label { font-size:.65rem; font-weight:800; position:absolute; bottom:-18px; left:50%; transform:translateX(-50%); white-space:nowrap; color:rgba(255,255,255,.7); letter-spacing:.3px; }
.step-dot.current .step-label { color:white; }
.step-dot.done .step-label { color:rgba(255,255,255,.9); }
.step-connector { height:2px; width:24px; background:rgba(255,255,255,.2); flex-shrink:0; }
.step-connector.done-line { background:var(--gold); }

/* STICKY NAV */
.main-nav { background:white; box-shadow:0 2px 12px rgba(0,0,0,.08); padding:0 40px; display:flex; gap:2px; overflow-x:auto; position:sticky; top:0; z-index:200; }
.nav-btn { padding:13px 16px; font-family:'Nunito',sans-serif; font-weight:700; font-size:.82rem; color:#666; background:none; border:none; border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap; transition:all .2s; }
.nav-btn:hover { color:var(--green); }
.nav-btn.active { color:var(--green); border-bottom-color:var(--green); }

/* MAIN CONTENT */
main { max-width:940px; margin:0 auto; padding:32px 24px 80px; }
.section { display:none; animation:fadein .4s ease; }
.section.active { display:block; }
@keyframes fadein { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.page-title { font-family:'Baloo 2',cursive; font-weight:800; font-size:2rem; margin-bottom:6px; }
.page-sub { color:#777; font-size:.95rem; margin-bottom:32px; }

/* SECTION CARDS */
.s-card { background:var(--card); border-radius:16px; box-shadow:0 2px 16px rgba(0,0,0,.07); margin-bottom:20px; overflow:hidden; transition:transform .2s,box-shadow .2s; }
.s-card:hover { transform:translateY(-2px); box-shadow:0 8px 32px rgba(0,0,0,.1); }
.s-card-header { display:flex; align-items:center; gap:14px; padding:18px 22px; cursor:pointer; user-select:none; }
.s-icon { width:42px; height:42px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; flex-shrink:0; }
.s-card-header h3 { font-family:'Baloo 2',cursive; font-weight:700; font-size:1.05rem; flex:1; }
.chevron { font-size:1.1rem; color:#aaa; transition:transform .3s; }
.s-card.open .chevron { transform:rotate(180deg); }
.s-body { display:none; padding:0 22px 22px; border-top:1.5px solid #f0f0f0; }
.s-card.open .s-body { display:block; }
.s-body p { margin:12px 0 10px; color:#444; line-height:1.65; font-size:.93rem; }
.s-body ul, .s-body ol { margin:8px 0 10px 20px; }
.s-body li { color:#444; line-height:1.6; font-size:.92rem; margin-bottom:4px; }

/* TEACHER CARDS */
.teacher-card { display:flex; gap:20px; align-items:center; background:white; border-radius:18px; padding:24px 28px; margin-bottom:24px; box-shadow:0 4px 20px rgba(0,0,0,.08); border-left:6px solid var(--en); }
.teacher-card.fr { border-left-color:var(--fr); }
.teacher-avatar { width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2.5rem; flex-shrink:0; box-shadow:0 4px 16px rgba(0,0,0,.12); }
.teacher-avatar.en { background:linear-gradient(135deg,#e3f2fd,#bbdefb); }
.teacher-avatar.fr { background:linear-gradient(135deg,#fce4ec,#f8bbd0); }
.teacher-info h3 { font-family:'Baloo 2',cursive; font-size:1.15rem; margin-bottom:2px; }
.teacher-info .t-title { font-size:.82rem; color:#888; font-weight:600; }
.teacher-info .t-desc { font-size:.88rem; color:#555; margin-top:6px; line-height:1.5; }
.teacher-speech { background:var(--en-l); border-radius:14px 14px 14px 4px; padding:10px 14px; font-size:.85rem; font-weight:600; color:var(--en-d); max-width:100%; line-height:1.5; margin-top:8px; display:inline-block; }
.teacher-speech.fr { background:var(--fr-l); color:var(--fr-d); }

/* TIP / INFO BOXES */
.tip-box { background:#fff8e1; border-left:4px solid var(--gold); border-radius:0 10px 10px 0; padding:11px 15px; margin:12px 0; display:flex; gap:10px; align-items:flex-start; font-size:.88rem; line-height:1.55; }
.info-box { background:#e8f0fe; border-left:4px solid var(--en); border-radius:0 10px 10px 0; padding:11px 15px; margin:12px 0; display:flex; gap:10px; align-items:flex-start; font-size:.88rem; line-height:1.55; }

/* QUIZ SYSTEM */
.quiz-wrap { margin-top:32px; }
.quiz-header { border-radius:16px 16px 0 0; padding:20px 24px; color:white; }
.quiz-header h2 { font-family:'Baloo 2',cursive; font-size:1.4rem; margin-bottom:4px; }
.quiz-header p { opacity:.9; font-size:.88rem; }
.quiz-body { background:white; border-radius:0 0 16px 16px; padding:24px; box-shadow:0 4px 20px rgba(0,0,0,.1); }
.quiz-q { background:#f8f9fa; border-radius:12px; padding:16px 18px; margin-bottom:14px; }
.q-num { font-size:.7rem; font-weight:800; text-transform:uppercase; letter-spacing:1px; opacity:.6; margin-bottom:4px; }
.quiz-q p { font-weight:700; color:var(--dark); font-size:.9rem; margin-bottom:10px; }
.quiz-q code { background:#e9ecef; padding:1px 6px; border-radius:4px; font-size:.85rem; }
.quiz-options { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.quiz-opt { border:2px solid #e0e0e0; border-radius:8px; padding:9px 12px; font-size:.83rem; font-family:'Nunito',sans-serif; cursor:pointer; font-weight:600; transition:all .2s; text-align:left; background:white; color:var(--dark); user-select:none; display:flex; align-items:center; gap:8px; }
.quiz-opt:hover { border-color:#999; background:#f5f5f5; transform:translateX(3px); }
.quiz-opt.selected { border-color:#555; background:#e8e8e8; color:#111; font-weight:800; transform:translateX(3px); box-shadow:inset 0 0 0 2px #555; }
.quiz-opt .opt-letter { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:6px; background:linear-gradient(135deg,var(--green),var(--green-d)); color:white; font-weight:800; font-size:.7rem; flex-shrink:0; }
.quiz-opt.correct { background:#d4edda; border-color:#28a745; color:#155724; font-weight:800; }
.quiz-opt.wrong { background:#f8d7da; border-color:#dc3545; color:#721c24; }
.quiz-progress-bar { height:6px; background:#e0e0e0; border-radius:3px; margin:16px 0; overflow:hidden; }
.quiz-progress-fill { height:100%; border-radius:3px; transition:width .5s; }
.quiz-submit-btn { width:100%; padding:14px; border:none; border-radius:12px; color:white; font-family:'Baloo 2',cursive; font-size:1.1rem; font-weight:700; cursor:pointer; transition:transform .2s,box-shadow .2s; margin-top:16px; box-shadow:0 4px 16px rgba(0,0,0,.2); }
.quiz-submit-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,.3); }
.quiz-result { display:none; text-align:center; padding:32px; }
.quiz-result.show { display:block; }
.result-score-big { font-family:'Baloo 2',cursive; font-size:4rem; font-weight:800; line-height:1; }
.result-pass { color:#28a745; }
.result-fail { color:#dc3545; }
.result-label { font-size:1.1rem; color:#666; margin:8px 0 20px; }
.quiz-retry-btn { background:#6c757d; color:white; border:none; border-radius:8px; padding:10px 24px; font-family:'Baloo 2',cursive; font-weight:700; cursor:pointer; font-size:.9rem; margin-top:12px; }

/* CERTIFICATE */
#certModal { display:none; position:fixed; inset:0; z-index:8000; background:rgba(0,0,0,.6); align-items:center; justify-content:center; }
#certModal.show { display:flex; }
.modal-box { background:white; border-radius:24px; padding:40px 32px; max-width:520px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.35); animation:popIn .5s cubic-bezier(.2,1.3,.5,1); }

/* HOME SECTION */
.home-hero { background:linear-gradient(135deg,var(--green-d),var(--green)); border-radius:20px; padding:36px 32px; color:white; margin-bottom:28px; box-shadow:0 8px 32px rgba(27,94,32,.3); text-align:center; }
.home-logo { font-family:'Baloo 2',cursive; font-size:3.5rem; font-weight:800; line-height:1; }
.home-logo span { color:var(--gold); }
.home-tagline { font-size:1.1rem; opacity:.9; margin-top:8px; }
.how-steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin:20px 0; }
.how-step { background:white; border-radius:14px; padding:20px 16px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.07); }
.how-step .step-emoji { font-size:2.2rem; margin-bottom:10px; }
.how-step h4 { font-family:'Baloo 2',cursive; font-size:.95rem; margin-bottom:6px; }
.how-step p { font-size:.82rem; color:#666; line-height:1.4; }
.progress-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin:20px 0; }
.prog-card { border-radius:16px; padding:20px; text-align:center; transition:transform .2s,box-shadow .2s; cursor:pointer; color:white; }
.prog-card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(0,0,0,.2); }
.prog-card .card-emoji { font-size:2.5rem; margin-bottom:10px; }
.prog-card h4 { font-family:'Baloo 2',cursive; font-size:1rem; margin-bottom:6px; }
.prog-card p { font-size:.78rem; opacity:.85; }

/* SECTION COLOR THEMES */
.theme-en .page-title { color:var(--en-d); }
.theme-en .quiz-header { background:linear-gradient(135deg,var(--en-d),var(--en)); }
.theme-en .quiz-progress-fill { background:linear-gradient(90deg,var(--en-d),var(--en)); }
.theme-en .quiz-submit-btn { background:linear-gradient(135deg,var(--en-d),var(--en)); }
.theme-en .s-card-header:hover h3 { color:var(--en-d); }
.theme-en .section-intro-banner { border-left:6px solid var(--en); }
.theme-en .section-intro-banner h3 { color:var(--en-d); }

.theme-es .page-title { color:var(--es-d); }
.theme-es .quiz-header { background:linear-gradient(135deg,var(--es-d),var(--es)); }
.theme-es .quiz-progress-fill { background:linear-gradient(90deg,var(--es-d),var(--es)); }
.theme-es .quiz-submit-btn { background:linear-gradient(135deg,var(--es-d),var(--es)); }
.theme-es .s-card-header:hover h3 { color:var(--es-d); }
.theme-es .section-intro-banner { border-left:6px solid var(--es); }
.theme-es .section-intro-banner h3 { color:var(--es-d); }
